name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job: gather the embedded web templates as a static artifact.
  # NOTE: These templates use Go template syntax ({{define}}, {{.VendorCount}},
  # etc.) and require the Go backend (cmd/server) to render. Deployed as-is to
  # GitHub Pages, they will show raw template syntax, not rendered HTML. This
  # workflow is primarily for archival / preview purposes; the production
  # control plane runs the compiled binary on Render/SnapDeploy per AGENTS.md.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Copy embedded web templates to _site
        run: |
          mkdir -p _site
          cp internal/web/templates/*.html _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
