name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job: gather the static HTML/JS web UI as a deployable artifact.
  # The templates are now pure static HTML + vanilla JS (no Go template syntax),
  # so they render directly on GitHub Pages. Data fetching via /api/v1/* endpoints
  # requires the compiled cmd/server binary running on Render/SnapDeploy per
  # AGENTS.md; Pages serves the UI shell only.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Copy embedded web templates to _site
        run: |
          mkdir -p _site
          cp internal/web/templates/*.html _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
