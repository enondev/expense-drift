<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendors - ExpenseDrift Control Plane</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <link href="https://unpkg.com/@tailwindcss/browser@4"></link>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <nav class="bg-white border-b border-gray-200 px-4 py-3">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="font-bold text-lg">ExpenseDrift</div>
      <div class="flex gap-4">
        <a href="/" class="text-blue-600 hover:text-blue-800">Dashboard</a>
        <a href="/diffs" class="text-blue-600 hover:text-blue-800">Diffs</a>
        <a href="/vendors" class="text-blue-600 hover:text-blue-800 font-semibold">Vendors</a>
        <a href="/targets" class="text-blue-600 hover:text-blue-800">Targets</a>
        <a href="/logout" class="px-3 py-2 text-sm bg-red-100 text-red-700 rounded hover:bg-red-200">Logout</a>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto py-6 px-4">
    <div class="mb-6 flex justify-between items-start gap-4">
      <div>
        <h1 class="text-2xl font-bold">Vendors</h1>
        <p class="text-gray-600">Monitored SaaS vendors</p>
      </div>
    </div>

    <div class="bg-white p-6 rounded shadow border border-gray-200">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-gray-200">
            <th class="pb-2 text-gray-600 text-sm">ID</th>
            <th class="pb-2 text-gray-600 text-sm">Name</th>
            <th class="pb-2 text-gray-600 text-sm">Category</th>
            <th class="pb-2 text-gray-600 text-sm">Homepage</th>
            <th class="pb-2 text-gray-600 text-sm">Status</th>
          </tr>
        </thead>
        <tbody id="vendors-table-body"></tbody>
      </table>
      <p id="vendors-empty" class="py-4 text-gray-500 text-center hidden">No vendors found.</p>
    </div>
  </div>

  <script>
    async function loadVendors() {
      try {
        const res = await fetch("/api/v1/vendors");
        const data = await res.json();
        const vendors = data.vendors || [];
        const tbody = document.getElementById("vendors-table-body");
        const empty = document.getElementById("vendors-empty");

        if (vendors.length === 0) {
          empty.classList.remove("hidden");
          tbody.innerHTML = "";
          return;
        }

        empty.classList.add("hidden");
        tbody.innerHTML = vendors.map(v => `
          <tr class="border-b border-gray-100 hover:bg-gray-50">
            <td class="py-2">${v.id}</td>
            <td class="py-2">${v.name}</td>
            <td class="py-2">${v.category}</td>
            <td class="py-2"><a href="${v.homepage_url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline">${v.homepage_url}</a></td>
            <td class="py-2">${v.status}</td>
          </tr>
        `).join("");
      } catch (e) {
        console.error("Failed to load vendors:", e);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadVendors();
    });
  </script>
</body>
</html>
