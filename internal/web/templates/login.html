{{define "login"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ExpenseDrift Control Plane</title>
  <link href="https://unpkg.com/@tailwindcss/browser@4"></link>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full space-y-8 p-4">
      <div>
        <h2 class="text-3xl font-bold text-center">ExpenseDrift</h2>
        <p class="text-center text-gray-600">Sign in to the control plane</p>
      </div>

      <div class="bg-white p-8 rounded shadow border border-gray-200">
        {{if .Error}}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm">
          Invalid username or password. Please try again.
        </div>
        {{end}}

        <form method="POST" action="/login" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" required
                   class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="admin">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required
                   class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="••••••••">
          </div>
          <button type="submit"
                  class="w-full px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
            Sign in
          </button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
{{end}}
